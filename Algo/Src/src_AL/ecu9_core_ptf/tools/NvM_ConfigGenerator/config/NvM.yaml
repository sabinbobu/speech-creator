# NvM product configuration.

# AUTOSAR vendor identifier reported by the module.
vendor_id: 1
# AUTOSAR module identifier assigned to NvM.
module_id: 20
# Identifier for the compiled configuration set, used by integration/startup checks.
compiled_config_id: 1
# Configured period, in seconds, between NvM_MainFunction calls.
main_function_period_seconds: 0.01
# Major component software version returned by the version-info API.
sw_major_version: 1
# Minor component software version returned by the version-info API.
sw_minor_version: 0
# Patch component software version returned by the version-info API.
sw_patch_version: 0
# Maximum number of standard asynchronous jobs that can wait in the NvM queue.
standard_job_queue_size: 4
# Maximum data bytes processed by an incremental CRC operation per main-function call.
crc_bytes_per_call: 3
# Select polling-driven job progression rather than a notification-driven profile.
polling_mode: true
# Enable NvM_SetRamBlockStatus in the generated API profile.
set_ram_block_status_api: true
# Enable NvM_GetVersionInfo in the generated API profile.
version_info_api: true
# Keep BswM status notifications disabled until the target BswM integration is enabled.
bswm_multi_block_job_status_information: false
# DEM event identifiers reported for the corresponding NvM error conditions.
#dem_events:
#  # Event reported for a hardware or lower-layer failure.
#  hardware: 100
#  # Event reported when stored block integrity validation fails.
#  integrity_failed: 101
#  # Event reported when an NvM request cannot be completed.
#  request_failed: 102
#  # Event reported when redundant storage loses one valid copy.
#  loss_of_redundancy: 103
#  # Event reported when a write is rejected because the block is protected.
#  write_protected: 104
# Logical NvM block definitions used to generate descriptors and RAM/ROM data.
blocks:
  # Configuration for NvM block ID 2.
  - id: 2
    # Number of data bytes in this block.
    length: 8
    # Configured physical payload capacity of the referenced Fee block, in bytes.
    fee_block_size: 32
    # Physical Fee logical block number configured by AL077.
    fee_block_numbers: [16]
    # Lower-layer storage target(s) used by this NvM block.
    target_block_reference:
      # Select the Fee backend for the target reference.
      backend: fee
      # Fee block symbol(s); a single entry is used for native management.
      fee_refs: [FEE_BLOCK_16_ID]
    # Native stores one copy; redundant management stores two copies.
    management_type: native
    # Preserve the block's data when the application software version changes.
    resistant_to_changed_sw: true
    # Reject write requests for this block when enabled.
    write_protected: false
    # Permit at most one successful write after initialization when enabled.
    write_once: false
    # Allow this block to use NvM_SetRamBlockStatus when the API is enabled.
    use_set_ram_block_status: true
    # Additional lower-layer read attempts after an unsuccessful read.
    max_read_retries: 0
    # Additional lower-layer write attempts after an unsuccessful write.
    max_write_retries: 0
    # CRC algorithm and enablement used to protect this block's data.
    crc:
      # Enable CRC storage, calculation, and validation for this block.
      enabled: true
      # CRC width/algorithm: crc8, crc16, crc32, or none when disabled.
      type: crc16
    # Compare the calculated RAM CRC with the stored CRC to detect changes.
    crc_compare_mechanism: true
    # Calculate and maintain the CRC for the RAM copy.
    calc_ram_block_crc: true
    # Initial data bytes used when restoring this block's ROM defaults.
    rom_defaults: [9, 8, 7, 6, 5, 4, 3, 2]
  # Configuration for NvM block ID 3.
  - id: 3
    # Number of data bytes in this block.
    length: 8
    # Configured physical payload capacity of both redundant Fee blocks, in bytes.
    fee_block_size: 24
    # Physical Fee logical block numbers configured by AL077.
    fee_block_numbers: [17, 33]
    # Lower-layer storage target(s) used by this NvM block.
    target_block_reference:
      # Select the Fee backend for the target reference.
      backend: fee
      # Two Fee symbols provide the copies required by redundant management.
      fee_refs: [FEE_BLOCK_17_ID, FEE_BLOCK_33_ID]
    # Native stores one copy; redundant management stores two copies.
    management_type: redundant
    # Preserve the block's data when the application software version changes.
    resistant_to_changed_sw: true
    # Reject write requests for this block when enabled.
    write_protected: false
    # Permit at most one successful write after initialization when enabled.
    write_once: true
    # Allow this block to use NvM_SetRamBlockStatus when the API is enabled.
    use_set_ram_block_status: true
    # Additional lower-layer read attempts after an unsuccessful read.
    max_read_retries: 1
    # Additional lower-layer write attempts after an unsuccessful write.
    max_write_retries: 1
    # CRC algorithm and enablement used to protect this block's data.
    crc:
      # Enable CRC storage, calculation, and validation for this block.
      enabled: true
      # CRC width/algorithm: crc8, crc16, crc32, or none when disabled.
      type: crc8
    # Initial data bytes used when restoring this block's ROM defaults.
    rom_defaults: [1, 3, 5, 7, 9, 11, 13, 15]
  # Configuration for NvM block ID 4.
  - id: 4
    # Number of data bytes in this block.
    length: 8
    # Configured physical payload capacity of the referenced Fee block, in bytes.
    fee_block_size: 48
    # Physical Fee logical block number configured by AL077.
    fee_block_numbers: [32]
    # Lower-layer storage target(s) used by this NvM block.
    target_block_reference:
      # Select the Fee backend for the target reference.
      backend: fee
      # Fee block symbol(s); a single entry is used for native management.
      fee_refs: [FEE_BLOCK_32_ID]
    # Native stores one copy; redundant management stores two copies.
    management_type: native
    # Preserve the block's data when the application software version changes.
    resistant_to_changed_sw: true
    # Reject write requests for this block when enabled.
    write_protected: false
    # Permit at most one successful write after initialization when enabled.
    write_once: false
    # Allow this block to use NvM_SetRamBlockStatus when the API is enabled.
    use_set_ram_block_status: true
    # Maintain the CRC for the RAM copy.
    calc_ram_block_crc: true
    # Additional lower-layer read attempts after an unsuccessful read.
    max_read_retries: 0
    # Additional lower-layer write attempts after an unsuccessful write.
    max_write_retries: 0
    # CRC algorithm and enablement used to protect this block's data.
    crc:
      # Enable CRC storage, calculation, and validation for this block.
      enabled: true
      # CRC width/algorithm: crc8, crc16, crc32, or none when disabled.
      type: crc32
    # Initial data bytes used when restoring this block's ROM defaults.
    rom_defaults: [0, 0, 0, 0, 0, 0, 0, 0]
  # Configuration for NvM block ID 5.
  - id: 5
    # Number of data bytes in this block.
    length: 1
    # Configured physical payload capacity of the referenced Fee block, in bytes.
    fee_block_size: 16
    # Physical Fee logical block number configured by AL077.
    fee_block_numbers: [48]
    # Lower-layer storage target(s) used by this NvM block.
    target_block_reference:
      # Select the Fee backend for the target reference.
      backend: fee
      # Fee block symbol(s); a single entry is used for native management.
      fee_refs: [FEE_BLOCK_48_ID]
    # Native stores one copy; redundant management stores two copies.
    management_type: native
    # Preserve the block's data when the application software version changes.
    resistant_to_changed_sw: true
    # Reject write requests for this block when enabled.
    write_protected: true
    # Permit at most one successful write after initialization when enabled.
    write_once: false
    # Allow this block to use NvM_SetRamBlockStatus when the API is enabled.
    use_set_ram_block_status: true
    # Additional lower-layer read attempts after an unsuccessful read.
    max_read_retries: 0
    # Additional lower-layer write attempts after an unsuccessful write.
    max_write_retries: 0
    # CRC algorithm and enablement used to protect this block's data.
    crc:
      # Enable CRC storage, calculation, and validation for this block.
      enabled: false
      # CRC width/algorithm: crc8, crc16, crc32, or none when disabled.
      type: none
    # Initial data bytes used when restoring this block's ROM defaults.
    rom_defaults: [0]
  # Configuration for NvM block ID 6.
  - id: 6
    # Number of data bytes in this block.
    length: 8
    # Configured physical payload capacity of the referenced Fee block, in bytes.
    fee_block_size: 64
    # Physical Fee logical block number configured by AL077.
    fee_block_numbers: [65]
    # Lower-layer storage target(s) used by this NvM block.
    target_block_reference:
      # Select the Fee backend for the target reference.
      backend: fee
      # Fee block symbol(s); a single entry is used for native management.
      fee_refs: [FEE_BLOCK_65_ID]
    # Native stores one copy; redundant management stores two copies.
    management_type: native
    # Use a dynamically supplied RAM block rather than a permanent configured RAM block.
    permanent_ram: false
    # Preserve the block's data when the application software version changes.
    resistant_to_changed_sw: true
    # Reject write requests for this block when enabled.
    write_protected: false
    # Permit at most one successful write after initialization when enabled.
    write_once: false
    # Allow this block to use NvM_SetRamBlockStatus when the API is enabled.
    use_set_ram_block_status: false
    # Include this block in NvM_ReadAll when its selection state permits.
    select_block_for_read_all: false
    # Include this block in NvM_WriteAll when its selection state permits.
    select_block_for_write_all: false
    # Additional lower-layer read attempts after an unsuccessful read.
    max_read_retries: 0
    # Additional lower-layer write attempts after an unsuccessful write.
    max_write_retries: 0
    # CRC algorithm and enablement used to protect this block's data.
    crc:
      # Enable CRC storage, calculation, and validation for this block.
      enabled: true
      # CRC width/algorithm: crc8, crc16, crc32, or none when disabled.
      type: crc16
    # Initial data bytes used when restoring this block's ROM defaults.
    rom_defaults: [6, 5, 4, 3, 2, 1, 0, 9]
  # Configuration for NvM block ID 7.
  - id: 7
    # Number of data bytes in this block.
    length: 8
    # Configured physical payload capacity of the referenced Fee block, in bytes.
    fee_block_size: 64
    # Physical Fee logical block number configured by AL077.
    fee_block_numbers: [80]
    # Lower-layer storage target(s) used by this NvM block.
    target_block_reference:
      # Select the Fee backend for the target reference.
      backend: fee
      # Fee block symbol(s); a single entry is used for native management.
      fee_refs: [FEE_BLOCK_80_ID]
    # Native stores one copy; redundant management stores two copies.
    management_type: native
    # Preserve the block's data when the application software version changes.
    resistant_to_changed_sw: true
    # Reject write requests for this block when enabled.
    write_protected: false
    # Permit at most one successful write after initialization when enabled.
    write_once: false
    # Allow this block to use NvM_SetRamBlockStatus when the API is enabled.
    use_set_ram_block_status: true
    # Additional lower-layer read attempts after an unsuccessful read.
    max_read_retries: 0
    # Additional lower-layer write attempts after an unsuccessful write.
    max_write_retries: 0
    # CRC algorithm and enablement used to protect this block's data.
    crc:
      # Enable CRC storage, calculation, and validation for this block.
      enabled: true
      # CRC width/algorithm: crc8, crc16, crc32, or none when disabled.
      type: crc8
    # Application callback that supplies this block's initialization data.
#    init_callback: NvM_TestInitCallback
  # Configuration for NvM block ID 8.
  - id: 8
    # Number of data bytes in this block.
    length: 8
    # Configured physical payload capacity of both redundant Fee blocks, in bytes.
    fee_block_size: 128
    # Physical Fee logical block numbers configured by AL077.
    fee_block_numbers: [64, 81]
    # Lower-layer storage target(s) used by this NvM block.
    target_block_reference:
      # Select the Fee backend for the target reference.
      backend: fee
      # Two Fee symbols provide the copies required by redundant management.
      fee_refs: [FEE_BLOCK_64_ID, FEE_BLOCK_81_ID]
    # Native stores one copy; redundant management stores two copies.
    management_type: redundant
    # Preserve the block's data when the application software version changes.
    resistant_to_changed_sw: true
    # Reject write requests for this block when enabled.
    write_protected: false
    # Permit at most one successful write after initialization when enabled.
    write_once: false
    # Allow this block to use NvM_SetRamBlockStatus when the API is enabled.
    use_set_ram_block_status: true
    # Additional lower-layer read attempts after an unsuccessful read.
    max_read_retries: 0
    # Additional lower-layer write attempts after an unsuccessful write.
    max_write_retries: 0
    # CRC algorithm and enablement used to protect this block's data.
    crc:
      # Enable CRC storage, calculation, and validation for this block.
      enabled: false
      # CRC width/algorithm: crc8, crc16, crc32, or none when disabled.
      type: none
    # Initial data bytes used when restoring this block's ROM defaults.
    rom_defaults: [8, 7, 6, 5, 4, 3, 2, 1]